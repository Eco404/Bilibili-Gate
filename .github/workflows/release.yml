name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # install deps
      - run: pnpm install --frozen-lockfile

      # turbo cache
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: turbo-cache-${{ runner.os }}

      # code check
      - run: pnpm turbo build:scss _typecheck

      # test
      - run: pnpm test

      # build
      - run: pnpm build:real-build
        env:
          MINIFY: 'false'
      - run: pnpm build:real-build
        env:
          MINIFY: 'true'

      - name: Prepare release notes
        run: |
          cp README.md CHANGELOG.md ./dist
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const changelog = readFileSync('CHANGELOG.md', 'utf8')
          const notes = changelog.split(`## v${version}\n`)[1]?.split(/\n## /)[0]?.trim()
          if (!notes) throw new Error(`Missing changelog for v${version}`)
          writeFileSync('dist/RELEASE_NOTES.md', notes + '\n')
          NODE

      # Publish both scripts and their metadata for userscript auto-updates.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: release
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Release ${{ github.ref_name }}'

      # release assets
      - name: Upload *.user.js to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*.user.js
          body_path: ./dist/RELEASE_NOTES.md
