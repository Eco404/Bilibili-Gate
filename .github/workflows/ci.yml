name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  # 很烦: 通知无法关掉
  # cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      RELEASE_NIGHTLY: 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set nightly version input
        run: echo "GHD_DESCRIBE=$(git describe --tags --long --always)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # install deps
      - run: pnpm install --frozen-lockfile

      # turbo cache
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: turbo-cache-${{ runner.os }}

      # code check
      - run: pnpm turbo build:scss _typecheck

      # test
      - run: pnpm test

      # run knip report
      - run: pnpm knip
        continue-on-error: true

      # build
      - run: pnpm build:real-build
        env:
          MINIFY: 'false'
      - run: pnpm build:real-build
        env:
          MINIFY: 'true'

      # prepare
      - run: cp README.md CHANGELOG.md ./dist

      # commit to release-nightly branch
      - uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: release-nightly
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
